[character]
disabled = false
success_symbol = '[ ](bright-yellow bold)'
error_symbol = '[ ](bright-red bold)'

[directory]
truncation_length = 2
style = "bright-yellow"

[git_branch]
style = "bright-purple bold italic"

[git_status]
style = "bright-red bold italic"

[time]
disabled = false
format = "[$time ](bright-yellow bold)"
time_format = "%R"